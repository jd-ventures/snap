# Every push and pull request: type-check, build, and run the smoke test
# against a real Chromium with dist/ loaded as an extension.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - run: npm run build

      - run: npm run smoke

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-screenshot
          path: scripts/smoke.png
          if-no-files-found: ignore
